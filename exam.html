<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Page</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/exam.css">
</head>
<body>

<div class="exam-container">

  <header class="exam-header">
    <h2>Online Examination</h2>
    <div class="timer">Time Left: <span id="time">10:00</span></div>
  </header>

  <div class="question-box">
    <div class="question-number">
      Question <span id="current-question">1</span> of <span id="total-questions">5</span>
    </div>

    <h3 id="question-text">Question will appear here</h3>

    <div class="options" id="options-container">
      <!--Options will be inserted dynamically-->
    </div>
  </div>

  <div class="exam-navigation">
    <button id="prev-btn" class="btn secondary-btn">Previous</button>
    <button id="next-btn" class="btn">Next</button>
    <button id="submit-btn" class="btn danger-btn">Submit Exam</button>
  </div>

</div>

<script src="js/exam.js"></script>
</body>
</html>
