<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="dashboard-container">

  <!--Sidebar-->
  <aside class="sidebar">
    <a href="index.html" class="logo">ExamPortal</a>
    <ul class="sidebar-links">
      <li class="active">Dashboard</li>
      <li>My Exams</li>
      <li>Results</li>
      <li>Logout</li>
    </ul>
  </aside>

  <!--Main Content-->
  <main class="main-content">

    <header class="dashboard-header">
      <h1>Welcome, Student 👋</h1>
      <p>Here are your available exams</p>
    </header>

    <section class="exam-list">

      <div class="exam-card">
        <h3>Data Structures Test</h3>
        <p>Duration: 30 Minutes</p>
        <a href="exam.html" class="btn start-exam-btn">Start Exam</a>
      </div>

      <div class="exam-card">
        <h3>Web Development Quiz</h3>
        <p>Duration: 20 Minutes</p>
        <button class="btn">Start Exam</button>
      </div>

      <div class="exam-card">
        <h3>Database Fundamentals</h3>
        <p>Duration: 25 Minutes</p>
        <button class="btn">Start Exam</button>
      </div>

    </section>

  </main>

</div>

</body>
</html>
